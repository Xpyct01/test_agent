[project]
name = "trip-planner"
version = "0.1.0"
description = "Two-agent LangGraph simulation that plans mountain trips to Picos de Europa."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ag-ui-protocol>=1.0.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi",
    "httpx",
    "langchain-core",
    "langchain-openai",
    "langfuse",
    "langgraph",
    "minio>=7.2.20",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlmodel>=0.0.50",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
experiments = [
    "beautifulsoup4>=4.15.0",
    "dvc[s3]>=3.67.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["trip_planner/unit_test"]

[tool.uv]
package = false

[tool.alembic]
# Migrations of the trip planner database. Run from the repository root:
#   uv run alembic upgrade head
# The database URL comes from the TRIP_DATABASE_ settings (env.py), not from here.
script_location = "%(here)s/trip_planner/app/core/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
output_encoding = "utf-8"
